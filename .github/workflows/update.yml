name: Update Netflix Malaysia MDBList

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install packages
        run: |
          pip install requests beautifulsoup4 lxml

      - name: Run updater
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          python update.py

      - name: Commit catalog
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add netflix-malaysia.json
          git commit -m "Update Netflix Malaysia catalog" || exit 0
          git push
